<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo</title>
<script defer src="main.js"></script></head>
<body>
    <div class="left">
        <div class="title">
            <h1>TaskMaster</h1>
        </div>
        <div class="tagline">
            <h4>Organized mind. Accomplished goals.</h4>
        </div>
        <hr class="content-hr">
        <h3 class="task-view" id="taskview">All Tasks:</h3>
        <div class="content-container" id="container">

            {% comment %} Task Lists {% endcomment %}

        </div>
    </div>
    <div class="right">
        <div class="addtaskbtn-container">
            <button class="taskbtn" id="taskBtn">Add Task</button>
        </div>
        <div class="timefilter">
            <div class="filter" id="alltask">All Tasks</div>
            <div class="filter" id="today">Today</div>
            <div class="filter" id="thisweek">This Week</div>
        </div>
        <div class="projects-container">
            <div class="projects-header">
                <h3>Projects</h3>
                
            </div>
            <div class="addproject-form">
                <input type="text" placeholder="Add Project" id="projectname">
                <button id="addproject" class="projectBtn">+</button>
            </div>
            <hr class="sidebar-hr">
            <div class="allprojects">
                <ul id="projectlist">
                    {% comment %} Project Lists {% endcomment %}
                </ul>
            </div>
        </div>
    </div>
    <dialog id="todo-dialog">
    <form id="todo-form">
      <h3>New Task</h3>
      <input type="text" id="todo-title" placeholder="Title" required>
      <textarea id="todo-desc" placeholder="Description"></textarea>
      <input type="date" id="todo-date">
      <select id="todo-priority">
        <option value="low">Low Priority</option>
        <option value="medium" selected>Medium Priority</option>
        <option value="high">High Priority</option>
      </select>
      <select id="todo-project-select"></select>
      <div class="modal-actions">
        <button type="submit" class="btn-save-task">Save Task</button>
        <button type="button" id="close-todo-modal">Cancel</button>
      </div>
    </form>
  </dialog>
</body>
</html>
